<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Morrowgear Family A validated turnaround</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #11171b; color: #d7e2e6; font-family: Consolas, monospace; }
    body { width: 1600px; min-height: 1180px; padding: 22px; }
    header { height: 66px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #435158; }
    h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: 0; }
    header span { color: #20d7df; font-size: 14px; }
    main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding-top: 12px; }
    figure { margin: 0; height: 342px; position: relative; overflow: hidden; background: #252c31; border: 1px solid #46535a; }
    figure.hero { grid-column: span 2; }
    canvas { width: 100%; height: 100%; display: block; }
    figcaption { position: absolute; left: 12px; top: 10px; padding: 4px 7px; color: #bfeef0; background: rgba(8, 13, 16, 0.72); border-left: 2px solid #20d7df; font-size: 13px; }
    footer { height: 48px; display: flex; align-items: center; justify-content: space-between; color: #8fa0a8; font-size: 12px; }
  </style>
</head>
<body>
  <header><h1 id="title">MORROWGEAR // FAMILY A</h1><span>SINGLE MODEL / ORTHOGRAPHIC VALIDATION</span></header>
  <main id="views"></main>
  <footer><span>16 MODEL UNITS = 1 BLOCK</span><span id="summary">RENDERING</span></footer>
  <script type="module" src="viewer.mjs"></script>
</body>
</html>
