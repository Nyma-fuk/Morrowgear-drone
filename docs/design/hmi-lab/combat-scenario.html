<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morrowgear 統合バイザーシナリオ</title><link rel="stylesheet" href="review.css"><link rel="stylesheet" href="combat-scenario.css"><link rel="stylesheet" href="combat-markers.css"><body>
<header><strong>MORROWGEAR / 複数戦線シナリオ</strong><a href="visor-worn.html">装着時HMIへ</a><a href="index.html#visor">コントローラーへ</a></header>
<main class="visor-main"><div class="controls"><button id="play">再生</button><button id="previous">前へ</button><button id="next">次へ</button><button id="reset">先頭へ</button><label>場面 <select id="step"></select></label><label>背景 <select id="background"><option value="day">昼</option><option value="night">夜</option></select></label></div>
<div class="controls marker-controls"><label><input id="labels" type="checkbox">全マーカーの説明</label><label><input id="motion" type="checkbox">動きを抑える</label><label><input id="safe" type="checkbox">視界の保護領域</label><button id="unpin" disabled>機体固定を解除</button><output id="pin-status">機体の固定なし</output></div>
<p class="note">統合設計案。1場面5秒、通知は2場面分を保持。戦線・敵マーカーで対象を展開し、機体マーカーで固定します。マーカーの位置と移動は仮データで、実ゲーム背景の機体位置やカメラには連動していません。関連線は攻撃レーザーではありません。</p>
<div class="viewport" id="viewport"><img id="world" src="assets/visor-day.png" alt="ゲーム背景"><div id="hud"></div><div class="safe-center">中央視界</div><div class="safe-bottom">標準HUD領域</div></div>
<section><h2 id="title"></h2><div class="controls"><label>表示外を含む戦線 <select id="selection"><option value="">選択なし</option><option value="01">交戦01 / 北東</option><option value="02">交戦02 / 西</option><option value="03">交戦03 / 南</option><option value="04">交戦04 / 南西</option></select></label></div><p class="note">△は機体、◈は味方群、◇は敵、端の矢印は画面外、破線の◇は最終確認位置。固定した機体は戦闘終了後も保持し、存在しなくなった標的への線は消えます。番号は戦闘中に変わりません。履歴は巻き戻した場面までに戻ります。</p><details><summary>戦闘履歴</summary><ol id="history"></ol></details></section></main><script src="combat-scenario.js"></script><script src="combat-markers.js"></script><script src="combat-integrated-view.js"></script></body></html>
