<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morrowgear 装着時HMI設計</title><link rel="stylesheet" href="review.css"><link rel="stylesheet" href="visor-adaptive.css">
<body><header><strong>MORROWGEAR / 装着時HMI</strong><a href="combat-scenario.html">複数戦線・戦闘ログのシナリオ</a><a href="design-review.html">全画面の設計</a><a href="index.html#visor">操作試作へ</a></header>
<main class="visor-main"><div class="controls"><label>状況 <select id="scene"><option value="normal">通常航行</option><option value="focus">機体を注視</option><option value="combat">複数戦線で戦闘</option><option value="recovery">電力喪失・回収</option><option value="stale">通信が途切れた場合</option><option value="dense">100機の運用</option></select></label><label>背景 <select id="background"><option value="day">昼</option><option value="night">夜</option></select></label><label><input type="checkbox" id="safe">表示禁止領域を確認</label><button id="pin">注視対象を固定</button></div>
<div class="controls timeline"><button id="play">動的シナリオを再生</button><button id="next">次の出来事</button><button id="reset">先頭へ</button><label><input id="focus" type="checkbox">RAVEN 02を注視</label><label><input id="motion" type="checkbox">動きを抑える</label><output id="step-name">静止比較</output></div>
<p class="note">設計案・未承認。動的シナリオは7段階の仮データです。実ゲーム画像に情報を重ねた比較用表示であり、マーカーは実機の3D投影・遮蔽と連動していません。</p>
<div class="viewport" id="viewport"><img id="world" src="assets/visor-day.png" alt="実ゲームの昼の背景"><div id="hud"></div><div class="safe-center">中央視界を保護</div><div class="safe-bottom">標準HUD・ホットバーを保護</div></div>
<section class="explanation"><h2 id="scenario-title"></h2><p id="scenario-reason"></p><p>動的シナリオでは敵発見、迎撃、照射、補給交代、撃破を進めて情報の展開・収縮を比較できます。注視と固定は別操作です。線は攻撃そのものではなく、割当関係を表す設計用表示です。</p></section></main><script src="visor-policy.js"></script><script src="visor-adaptive.js"></script><script src="visor-worn.js"></script></body></html>
